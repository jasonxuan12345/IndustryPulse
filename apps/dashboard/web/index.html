<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IndustryPulse · 早期信号与行业研究</title>
  <link rel="stylesheet" href="/dashboard-assets/style.css">
  <link rel="stylesheet" href="/dashboard-assets/news-sources.css">
  <script defer src="/dashboard-assets/app.js"></script>
  <script defer src="/dashboard-assets/model-settings.js"></script>
  <script defer src="/dashboard-assets/news-sources.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="IndustryPulse 首页">
      <span class="brand-icon">◈</span>
      <span>Industry<span class="accent">Pulse</span><small>早期潜伏 · 高危预警</small></span>
    </a>
    <div class="nav-label">RESEARCH WORKSPACE</div>
    <nav id="nav">
      <button data-page="radar" class="active"><span>✧</span>早期雷达</button>
      <button data-page="sector"><span>◫</span>行业透视</button>
      <button data-page="smart"><span>⚖</span>机构动向</button>
      <button data-page="verify"><span>⌕</span>投喂核验 &amp; 回看</button>
    </nav>
    <div class="sidebar-bottom">
      <div class="connection"><i></i><span id="connection">正在连接本地工作台</span></div>
      <button data-page="settings" class="settings-button">⚙ 模型与数据源设置 <span>↗</span></button>
      <div class="profile">
        <b>J</b>
        <span>投研决策台<small>LOCAL AI + QUANT</small></span>
      </div>
    </div>
  </aside>

  <div class="shell">
    <header>
      <div class="breadcrumb">工作空间 <span>/</span> <b id="breadcrumb">早期雷达</b></div>
      <div class="header-tools">
        <label class="search">
          <span>⌕</span>
          <input id="search" placeholder="搜索新闻、行业、机构…" aria-label="搜索">
          <kbd>/</kbd>
        </label>
        <button id="refresh" class="icon-button" title="刷新全部数据" aria-label="刷新数据">↻</button>
        <span class="avatar">J</span>
      </div>
    </header>

    <main id="main">
      <div class="loading">正在载入工作台…</div>
    </main>

    <footer>
      <span>INDUSTRYPULSE <span class="accent">/</span> EARLY SIGNAL BEFORE CONSENSUS</span>
      <span id="footer-status">准备就绪</span>
    </footer>
  </div>

  <dialog id="detail">
    <button id="close-detail" class="close" aria-label="关闭详情">×</button>
    <div id="detail-body"></div>
  </dialog>
  <div id="toast" role="status"></div>
</body>
</html>
