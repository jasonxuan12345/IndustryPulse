<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主动研究与机会 · IndustryPulse</title><link rel="icon" href="data:,"><style>
:root{color-scheme:dark;font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:#10151d;color:#e8edf4}*{box-sizing:border-box}body{margin:0}main{max-width:1280px;margin:auto;padding:30px 24px 70px}a{color:#89bafa}nav,.toolbar{display:flex;gap:16px;flex-wrap:wrap;align-items:center}h1{font-size:30px;margin-bottom:10px}h2{font-size:21px}.muted,small{color:#adbacb;line-height:1.7}.notice{border-left:3px solid #83b8fa;background:#1b293a;padding:17px 20px;line-height:1.7;margin:24px 0}button,select{background:#21334a;color:inherit;border:1px solid #465b75;padding:10px 14px;border-radius:5px;font:inherit;cursor:pointer}button:disabled{opacity:.5}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin:28px 0}.metric{border-top:1px solid #3a4c62;padding-top:12px}.value{font-size:28px}.items article{border-top:1px solid #344154;padding:23px 0}.items h3{margin:0 0 9px}.tag{display:inline-block;background:#25364c;padding:3px 9px;font-size:12px;margin:4px 5px 4px 0}.positive{color:#94d6b8}.facts{font-size:13px;line-height:1.8;overflow-wrap:anywhere}summary{cursor:pointer;color:#89bafa;margin-top:16px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:10px 7px;border-bottom:1px solid #2d394a;vertical-align:top}th{color:#adbacb;font-weight:500}pre{font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.box{background:#17212d;padding:22px;margin:20px 0}.hash{font-family:Consolas,monospace;font-size:11px;overflow-wrap:anywhere}#feedback{color:#e2c69b;min-height:23px}footer{margin-top:32px;border-top:1px solid #344154;padding-top:18px}@media(max-width:700px){main{padding:23px 16px}.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}h1{font-size:25px}}
</style></head><body><main><nav><a href="/">工作台</a><a href="/ledger">前瞻账本</a><span class="muted">INDUSTRYPULSE / EVENT RESEARCH</span></nav>
<h1>从新证据走到有条件的机会</h1><p class="muted">全部已配置行业持续扫描。每次数据变化连接当时模型、独立反证和前瞻记录，逐项显示准入与撤销条件。</p>
<div class="notice">“研究候选”表示经济证据值得继续核对。模拟目标权重需要同时通过数据、资产映射、价格、独立研究及模型验收。证据分值用于安排研究顺序，不是预期收益率。</div>
<div class="toolbar"><button id="refresh">刷新结果</button><button id="run">运行模型与AI研究</button><button id="sync">采集新数据并运行</button><button id="monitor">自动研究状态</button><a href="/api/research/report" target="_blank">导出完整JSON</a></div><p id="feedback" role="status"></p><div id="health" class="muted facts"></div><div id="metrics" class="metrics"></div>
<div class="toolbar"><h2>机会搜索结果</h2><select id="filter"><option value="all">全部行业</option><option value="economic">经济改善候选</option><option value="admitted">通过全部准入</option><option value="blocked">有待补齐的门槛</option></select></div><div id="items" class="items"></div>
<div class="grid"><section class="box"><h2>组合与撤销规则</h2><div id="risk" class="facts"></div></section><section class="box"><h2>可信基线核对</h2><div id="baseline" class="facts"></div></section></div>
<details class="box"><summary>来源采集、失败和待处理记录</summary><pre id="sources"></pre></details><footer class="muted facts">所有研究记录以实际登记时点进入前瞻账本。初次捕获历史材料不会成为历史推荐。应用关闭期间不补造研究触发；研究账户按事前计划模拟估值，未连接实盘账户。</footer></main>
<script>
const $=s=>document.querySelector(s), E=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let report={},busy=false;
const num=v=>v==null?'—':Number(v).toFixed(2);const pct=v=>v==null?'—':(v*100).toFixed(2)+'%';const names={CONDITIONAL_CANDIDATE:'有条件候选',RESEARCH_CANDIDATE:'经济改善研究候选',OBSERVE:'继续观察'};
const label={completed:'已完成双步研究',pending:'待研究',awaiting_model:'等待可用模型',not_requested:'本次未调用AI',budget_deferred:'预算待续',failed:'调用失败待重试',rejected:'结构校验拒绝'};
async function api(path,payload){let r=await fetch('/api/research/'+path,payload===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail||d));return d}
function render(){let d=report,items=d.items||[],p=d.policy||{},a=d.allocation||{},b=d.baseline||{};$('#health').textContent=`自动研究${d.settings?.enabled?'已启用':'未启用'} · 最近运行 ${d.finished_at||'尚未运行'} · 检查 ${d.checked||0}/${d.universe_size||0} 行业 · ${d.status||'等待'} · AI调用预算每日12次（每次完整研究需2次）`;$('#monitor').textContent=d.settings?.enabled?'暂停自动研究':'启用自动研究';$('#metrics').innerHTML=[['经济改善候选',items.filter(x=>x.economic_signal).length],['通过全部准入',items.filter(x=>x.admitted).length],['待完成AI研究',d.ai_pending??'—'],['模拟现金权重',pct(a.cash_weight)]].map(([k,v])=>`<div class="metric"><small>${E(k)}</small><div class="value">${E(v)}</div></div>`).join('');const f=$('#filter').value;items=items.filter(x=>f==='all'||f==='economic'&&x.economic_signal||f==='admitted'&&x.admitted||f==='blocked'&&x.blocking_reasons.length);$('#items').innerHTML=items.map(x=>`<article><h3>${E(x.name)}</h3><span class="tag ${x.economic_signal?'positive':''}">${E(names[x.tier])}</span><span class="tag">证据 ${x.evidence_score}/${x.score_max}</span><span class="tag">${E(x.asset_id||'缺资产映射')} · ${E(x.fit)}</span><span class="tag">${E(label[x.ai_review]||x.ai_review)}</span><p class="facts">利润同比变动 ${num(x.profit_change_pp)} 个百分点 · 营收同比 ${num(x.revenue_yoy_pct)}% · 营收／成本增速差 ${num(x.revenue_cost_spread_pp)} 个百分点<br>20日价格超额 ${pct(x.relative_20d)} · 年化波动 ${pct(x.annualized_volatility)} · 60日最大回撤 ${pct(x.max_drawdown_60d)} · 模拟目标权重 ${pct(x.target_weight)}</p><p class="muted facts">待满足：${E(x.blocking_reasons.join('；')||'本次全部条件通过')}<br>${E(x.score_definition)}</p><details><summary>逐项检查、当时事实与撤销条件</summary><div class="scroll"><table><thead><tr><th>条件</th><th>结果</th><th>观测</th><th>门槛</th></tr></thead><tbody>${x.checks.map(c=>`<tr><td>${E(c.check)}</td><td>${c.passed?'通过':'待满足'}</td><td>${E(typeof c.observed==='number'?num(c.observed):typeof c.observed==='object'?JSON.stringify(c.observed):c.observed)}</td><td>${E(c.required)}</td></tr>`).join('')}</tbody></table></div><ul class="facts">${x.facts.map(v=>`<li>${E(v.series_id)} · ${E(v.period)} · ${E(v.value)} · 版本${v.vintage_id} · 可用${E(v.available_at)} · ${link(v.source_url)}</li>`).join('')}${x.invalidation_conditions.map(v=>`<li>撤销／暂停：${E(v)}</li>`).join('')}</ul></details><details><summary>三个预测目标与样本外诊断</summary><p class="muted facts">${E(d.model_boundary)}</p>${(x.forecast.targets||[]).map(t=>`<h4>${E(t.target)} · ${E(t.meaning)}</h4><p class="muted facts">${E(t.edge)} · 共同OOS ${E(t.common_oos??0)} · ${E(t.error||'')}</p><div class="scroll"><table><thead><tr><th>模型</th><th>方向概率</th><th>训练样本</th><th>OOS数</th><th>Brier</th><th>诊断</th></tr></thead><tbody>${t.models.map(m=>`<tr><td>${E(m.model)}</td><td>${pct(m.prediction?.predicted_probability)}</td><td>${E(m.prediction?.training_rows)}</td><td>${m.oos.length}</td><td>${m.brier==null?'—':m.brier.toFixed(4)}</td><td>${E(m.error||m.oos_failures?.[0]||'未校准，未验收优势')}</td></tr>`).join('')}</tbody></table></div>`).join('')}</details><details><summary>AI解释、独立反证与上版假设关系</summary>${x.previous_ai_hypothesis&&!x.ai_hypothesis?"<p class=muted>以下是上一版研究，当前输入等待更新。</p>":""}${(x.ai_hypothesis||x.previous_ai_hypothesis)?`<p>${E((x.ai_hypothesis||x.previous_ai_hypothesis).statement)}</p><p class="facts">${E((x.ai_hypothesis||x.previous_ai_hypothesis).transmission)}</p><p>反证结论 ${E((x.ai_hypothesis||x.previous_ai_hypothesis).counter_verdict)}</p><ul class="facts">${((x.ai_hypothesis||x.previous_ai_hypothesis).counter_evidence||[]).map(c=>`<li>${E(c.fact_ref)} · ${E(c.weight)} · ${E(c.observation)} · ${E(c.note)}</li>`).join('')}</ul><p class="facts">下次验证：${E((x.ai_hypothesis||x.previous_ai_hypothesis).next_verification)}</p>`:`<p class="muted facts">${E(label[x.ai_review]||x.ai_review)}。原始模型和筛选结果已保存。</p><pre>${E(JSON.stringify(x.ai_failures||[],null,2))}</pre>`}<a href="/api/research/events/${encodeURIComponent(x.event_id)}" target="_blank">查看冻结事件、上版假设与完整输入</a></details><p class="hash muted">事件 ${E(x.event_id)} · 输入SHA256 ${E(x.input_sha256)}</p></article>`).join('')||'<p class="muted">当前筛选没有记录。</p>';$('#risk').innerHTML=`单资产≤${pct(p.single_asset_weight)}，单行业≤${pct(p.industry_weight)}，总风险敞口≤${pct(p.total_weight)}；换手上限${pct(p.max_turnover)}，风险撤销优先。<br>原登记窗口亏损${pct(p.asset_loss_revoke)}或回撤${pct(p.asset_drawdown_revoke)}触发撤销；组合回撤${pct(p.portfolio_drawdown_pause)}暂停新增敞口；风险撤销后冷静期${E(p.risk_cooldown_days)}天。<br>正常单边佣金${E(p.commission_bps)}bps＋滑点${E(p.slippage_bps)}bps；压力情景${E(p.stress_commission_bps)}＋${E(p.stress_slippage_bps)}bps。预期收益缺乏证据时保持空值。<br>${E(a.scope||'')}`;$('#baseline').innerHTML=`疑似跳点未分类 ${E(b.unclassified_gaps??'未核对')} 个；已核对公告 ${(b.corporate_documents||[]).filter(x=>x.verified).length} 份。<br>待完成分红独立核对 ${(b.dividend_unresolved||[]).length} 条。<br>历史可见性：重建PIT；同期原件严格历史证据尚未齐全。<details><summary>查看每个来源和公司行动</summary><pre>${E(JSON.stringify({documents:b.corporate_documents,dividends:b.assets,barriers:b.price_barriers},null,2))}</pre></details>`;$('#sources').textContent=JSON.stringify({source_health:d.source_health,errors:d.errors,monitor_error:d.monitor_error,missing_inputs:d.missing_inputs,risk_review:d.risk_review},null,2)}
function link(url){try{const u=new URL(url);return ['http:','https:'].includes(u.protocol)?`<a href="${E(u.href)}" target="_blank" rel="noopener noreferrer">来源原文</a>`:E(url)}catch{return E(url)}}
async function load(){try{report=await api('report');render()}catch(e){$('#feedback').textContent=e.message}}async function action(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);$('#feedback').textContent='正在执行，逐行业计算与独立研究可能需要数分钟…';try{let r=await fn();await load();$('#feedback').textContent=r.status==='degraded'?'运行完成，部分来源或行业存在待处理项，详见诊断。':'运行完成，结果和原始证据已保存。'}catch(e){$('#feedback').textContent=e.message}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}$('#refresh').onclick=load;$('#filter').onchange=render;$('#run').onclick=()=>action(()=>api('run',{}));$('#sync').onclick=()=>action(()=>api('run',{refresh_sources:true}));$('#monitor').onclick=()=>action(()=>api('settings',{enabled:!report.settings?.enabled,ai_enabled:true}));load();setInterval(()=>{if(!busy&&!document.querySelector('details[open]'))load()},60000);
</script></body></html>
