# 宏观指标注册表：provider+source 取数，field 映射为指标
# - provider=eastmoney: 东财数据中心报表（快，JSON）
# - provider=chinamoney: 中国货币网（中间价 / LPR / Shibor / 国债收益率）
# 期次/单位/频率在服务层随数据返回，UI 必须展示最新期次。
# 停更或需要 akshare 才能取到的序列不放进这个表，避免界面出现“尚未同步”。
indicators:
  # —— 东财数据中心（原生，快） ——
  - { id: gdp_quarterly, name: GDP 当季总量, provider: eastmoney, source: RPT_ECONOMY_GDP,
      date_field: REPORT_DATE, field: DOMESTICL_PRODUCT_BASE, unit: 亿元, freq: quarterly }
  - { id: cpi_yoy, name: CPI 同比, provider: eastmoney, source: RPT_ECONOMY_CPI,
      date_field: REPORT_DATE, field: NATIONAL_SAME, unit: "%", freq: monthly }
  - { id: ppi_yoy, name: PPI 同比, provider: eastmoney, source: RPT_ECONOMY_PPI,
      date_field: REPORT_DATE, field: BASE_SAME, unit: "%", freq: monthly }
  - { id: pmi_mfg, name: 制造业 PMI, provider: eastmoney, source: RPT_ECONOMY_PMI,
      date_field: REPORT_DATE, field: MAKE_INDEX, unit: "", freq: monthly }
  - { id: pmi_non_mfg, name: 非制造业 PMI, provider: eastmoney, source: RPT_ECONOMY_PMI,
      date_field: REPORT_DATE, field: NMAKE_INDEX, unit: "", freq: monthly }
  - { id: fixed_asset_invest, name: 固定资产投资累计, provider: eastmoney, source: RPT_ECONOMY_ASSET_INVEST,
      date_field: REPORT_DATE, field: BASE_ACCUMULATE, unit: 亿元, freq: monthly }
  - { id: fiscal_income, name: 财政收入累计, provider: eastmoney, source: RPT_ECONOMY_INCOME,
      date_field: REPORT_DATE, field: BASE_ACCUMULATE, unit: 亿元, freq: monthly }
  - { id: tax_income, name: 税收收入累计, provider: eastmoney, source: RPT_ECONOMY_TAX,
      date_field: REPORT_DATE, field: TAX_INCOME, unit: 亿元, freq: quarterly }
  - { id: fdi_actual, name: 实际使用外资, provider: eastmoney, source: RPT_ECONOMY_FDI,
      date_field: REPORT_DATE, field: ACTUAL_FOREIGN, unit: 万元, freq: monthly }
  - { id: house_price_bj, name: 北京新建住宅同比指数, provider: eastmoney, source: RPT_ECONOMY_HOUSE_PRICE,
      date_field: REPORT_DATE, field: FIRST_COMHOUSE_SAME, city_field: CITY, city: 北京,
      unit: 指数, freq: monthly }
  - { id: m2_yoy, name: M2 同比, provider: eastmoney, source: RPT_ECONOMY_CURRENCY_SUPPLY,
      date_field: REPORT_DATE, field: BASIC_CURRENCY_SAME, unit: "%", freq: monthly }
  - { id: m1_yoy, name: M1 同比, provider: eastmoney, source: RPT_ECONOMY_CURRENCY_SUPPLY,
      date_field: REPORT_DATE, field: CURRENCY_SAME, unit: "%", freq: monthly }
  - { id: export_yoy, name: 出口金额当月同比, provider: eastmoney, source: RPT_ECONOMY_CUSTOMS,
      date_field: REPORT_DATE, field: EXIT_BASE_SAME, unit: "%", freq: monthly }
  - { id: import_yoy, name: 进口金额当月同比, provider: eastmoney, source: RPT_ECONOMY_CUSTOMS,
      date_field: REPORT_DATE, field: IMPORT_BASE_SAME, unit: "%", freq: monthly }
  - { id: industrial_value_added_yoy, name: 工业增加值同比, provider: eastmoney, source: RPT_ECONOMY_INDUS_GROW,
      date_field: REPORT_DATE, field: BASE_SAME, unit: "%", freq: monthly }
  - { id: northbound_net, name: 北向资金累计净买入, provider: eastmoney, source: RPT_MUTUAL_DEAL_HISTORY,
      date_field: _date, field: ACCUM_DEAL_AMT, unit: 万元, freq: daily }

  # —— 中国货币网（官方发布，免登录 JSON） ——
  - { id: lpr_1y, name: LPR 1 年, provider: chinamoney, source: lpr,
      date_field: date, field: 1Y, unit: "%", freq: monthly }
  - { id: lpr_5y, name: LPR 5 年, provider: chinamoney, source: lpr,
      date_field: date, field: 5Y, unit: "%", freq: monthly }
  - { id: shibor_on, name: Shibor 隔夜, provider: chinamoney, source: shibor,
      date_field: date, field: "ON", unit: "%", freq: daily }
  - { id: shibor_1w, name: Shibor 1 周, provider: chinamoney, source: shibor,
      date_field: date, field: 1W, unit: "%", freq: daily }
  - { id: usdcny_mid, name: 美元兑人民币中间价, provider: chinamoney, source: usdcny,
      date_field: date, field: value, unit: "", freq: daily }
  - { id: cn_gov_bond_10y, name: 中国国债收益率 10 年, provider: chinamoney, source: cn_yield,
      date_field: date, field: value, unit: "%", freq: daily }
