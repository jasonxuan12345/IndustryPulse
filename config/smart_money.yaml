# 国内外知名投资机构与投资人跟踪配置
# 注意：机构持仓披露天然存在滞后性（SEC 13F 最长滞后 45 天，国内公募季报约 15-30 天），
# 本模块仅作“中长期资本迁移方向”与“高危扎堆拥挤度”的辅助参考，不作短线买点。
institutions:
  - id: berkshire
    name: Berkshire Hathaway（巴菲特）
    region: US
    style: 价值长线 / 高现金流护城河
    cik: "0001067983"
    disclosure_lag_days: 45
    focus_sectors: [finance, chemicals, consumer, energy]
    notes: 关注传统能源、金融保险及消费龙头配置变动与现金储备水位

  - id: bridgewater
    name: Bridgewater Associates（桥水）
    region: US
    style: 全天候宏观对冲
    cik: "0001350694"
    disclosure_lag_days: 45
    focus_sectors: [macro, metals, finance, consumer]
    notes: 关注大宗商品、黄金/有色通胀对冲及宏观周期切换观点

  - id: coatue
    name: Coatue Management
    region: US
    style: 全球科技与 AI 产业链
    cik: "0001135730"
    disclosure_lag_days: 45
    focus_sectors: [ai, semiconductor, digital, energy]
    notes: 聚焦算力基础设施、半导体设备、数据中心电力及软件应用迁移

  - id: ark
    name: ARK Invest（木头姐）
    region: US
    style: 颠覆式成长与机器人/生物科技
    cik: "0001697748"
    disclosure_lag_days: 45
    focus_sectors: [ai, auto, health, digital]
    notes: 此处跟踪季度 13F，ARK 日度交易在独立渠道中标记

  - id: himalaya
    name: Himalaya Capital（李录）
    region: US
    style: 深度价值 / 中美跨市场
    cik: "0001709323"
    disclosure_lag_days: 45
    focus_sectors: [finance, consumer, auto, digital]
    notes: 关注低估值金融、消费及中国新能源车/制造业长期复利标的

  - id: cn_public_funds
    name: 国内主动偏股公募（季报重仓）
    region: CN
    style: 公募机构主流共识
    cik: ""
    disclosure_lag_days: 20
    focus_sectors: [semiconductor, ai, energy, health, auto, consumer]
    notes: 极强反向风向标：公募抱团极度一致往往提示高危拥挤，低配拐点提示潜伏

  - id: northbound_capital
    name: 北向/外资配置风向
    region: CN
    style: 跨市场外资审美
    cik: ""
    disclosure_lag_days: 0
    focus_sectors: [consumer, finance, health, metals, semiconductor]
    notes: 关注季度持股变化与活跃股成交，日度净买额已停更

  - id: industrial_capex
    name: 产业资本与链主（CapEx 跟踪）
    region: GLOBAL
    style: 产业链真实订单与资本开支
    cik: ""
    disclosure_lag_days: 15
    focus_sectors: [ai, semiconductor, energy, metals, chemicals]
    notes: 微软/谷歌/英伟达/宁德时代等链主资本开支转向往往早于财务利润兑现

data_channels:
  - id: sec_13f
    name: SEC 13F 披露持仓
    frequency: 季度
    coverage_basis: 报告期
    gap: 仅包含各机构公开申报的 13F 持仓，权重以申报表内总市值为分母。未映射证券保留原名。
  - id: ark_trades
    name: ARK 公开交易
    frequency: 交易日
    coverage_basis: 交易日期
    gap: 暂未接入日度交易记录。
  - id: cn_public_funds
    name: 国内公募披露持仓
    kind: holding
    frequency: 季度
    coverage_basis: 手工摘录的披露日期
    gap: 支持手工摘录，尚未自动采集，覆盖范围取决于录入。
  - id: northbound_capital
    name: 北向资金
    kind: holding
    frequency: 季度持股 / 活跃股成交
    coverage_basis: 手工摘录的披露日期
    gap: 季度持股和活跃股成交尚未自动接入。日度净买入历史截至 2024-08-16。
  - id: industrial_capex
    name: 企业 CapEx
    kind: capex
    frequency: 财报季度 / 披露事件
    coverage_basis: 手工摘录的披露日期
    gap: 支持手工摘录财报或纪要，尚未自动采集。

