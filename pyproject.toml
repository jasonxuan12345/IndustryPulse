[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrypulse"
version = "0.2.0"
description = "IndustryPulse：行业情报、量化位置预警与 AI 蝴蝶效应分析工作台"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
authors = [{ name = "Jackson" }]
dependencies = [
    "PyYAML>=6.0,<7",
    "duckdb>=1.1,<2",
    "fastapi>=0.111,<1",
    "httpx>=0.27,<1",
    "pandas>=2.2,<3",
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
industrypulse = "industrypulse.cli:app"

[project.optional-dependencies]
market = ["akshare>=1.14,<2"]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.2,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.6,<1",
    "types-PyYAML>=6,<7",
    "pandas-stubs>=2.2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["akshare"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["industrypulse"]
omit = ["*/__init__.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "@overload"]
